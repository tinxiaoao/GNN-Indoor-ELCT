[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-indoor-elct-candidate"
version = "0.1.0.dev0"
description = "Geo-ELCT from supplied semantic maps, with explicit historical correction modes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "opencv-contrib-python>=4.11,<4.12",
  "pandas>=2.2,<2.3",
  "openpyxl>=3.1,<3.2",
  "Pillow>=9.4,<10",
  "matplotlib>=3.9,<3.10",
]

[project.scripts]
geo-elct = "geo_elct.__main__:main"

[tool.setuptools.packages.find]
include = ["geo_elct*", "experiments*", "gnn*"]

[tool.setuptools.package-data]
geo_elct = ["source_provenance.json", "correction_v2_provenance.json"]
